<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}abuba8{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
  })();
</script>
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="/" class="logo">
      <span class="logo-mark">◆</span>
      <span class="logo-text">abuba8</span>
    </a>
    <nav class="nav-links">
      <a href="/#news">News</a>
      <a href="/#research">Research</a>
      <a href="/#publications">Publications</a>
      <a href="/#projects">Projects</a>
      <a href="/cv">CV</a>
      <a href="/#contact">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-cols">
      <a href="/#news">News</a>
      <a href="/#research">Research</a>
      <a href="/#publications">Publications</a>
      <a href="/#projects">Projects</a>
      <a href="/#fun-facts">Fun Facts</a>
      <a href="/#contact">Contact</a>
    </div>
    <div class="footer-social">
      <a href="{{ contact.github if contact else '#' }}">GitHub</a>
      <a href="{{ contact.scholar if contact else '#' }}">Scholar</a>
      <a href="{{ contact.linkedin if contact else '#' }}">LinkedIn</a>
      <a href="{{ contact.twitter if contact else '#' }}">Twitter</a>
    </div>
    <div class="footer-copy">© All rights reserved.</div>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
